server:
  port: 8080
  servlet:
    session:
      cookie:
        name: JSESSIONID
        same-site: Lax

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/tedris_crm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  cors:
    allowed-origins: ${CRM_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,https://crm.codev.academy}
  billing:
    first-payment-delay-months: ${CRM_FIRST_PAYMENT_DELAY_MONTHS:0}
  reminders:
    mode: ${CRM_REMINDERS_MODE:MANUAL}
    webhook-url: ${CRM_REMINDERS_WEBHOOK_URL:}
    webhook-token: ${CRM_REMINDERS_WEBHOOK_TOKEN:}

logging:
  level:
    com.crm: INFO
    org.flywaydb: DEBUG
