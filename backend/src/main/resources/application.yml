
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    session:
      cookie:
        name: JSESSIONID
        same-site: Lax

spring:
  application:
    name: tedris-crm

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.zoho.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins: ${CRM_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  billing:
    first-payment-delay-months: ${CRM_FIRST_PAYMENT_DELAY_MONTHS:0}

  reminders:
    mode: ${CRM_REMINDERS_MODE:MANUAL}
    webhook-url: ${CRM_REMINDERS_WEBHOOK_URL:}
    webhook-token: ${CRM_REMINDERS_WEBHOOK_TOKEN:}

  bootstrap-admin:
    email: ${CRM_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${CRM_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    com.crm: INFO
    org.springframework.security: INFO
