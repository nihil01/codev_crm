server:
  port: 8080
  servlet:
    session:
      cookie:
        name: JSESSIONID
        same-site: Lax

spring:
  application:
    name: tedris-crm

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tedris_crm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.zoho.com
    port: 587
    username: ${MAIL_USERNAME:info@codev.az}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,https://crm.codev.academy,https://codev.academy

  billing:
    first-payment-delay-months: ${CRM_FIRST_PAYMENT_DELAY_MONTHS:0}
  reminders:
    mode: ${CRM_REMINDERS_MODE:MANUAL}
    webhook-url: ${CRM_REMINDERS_WEBHOOK_URL:}
    webhook-token: ${CRM_REMINDERS_WEBHOOK_TOKEN:}
  bootstrap-admin:
    email: ${CRM_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${CRM_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    com.crm: INFO
    org.springframework.security: INFO
